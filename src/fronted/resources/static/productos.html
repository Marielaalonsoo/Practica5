<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Online - Productos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>Productos</h1>
    <p>Consulta nuestro catálogo</p>
</header>

<nav>
    <a href="index.html">Inicio</a>
    <a href="productos.html">Productos</a>
    <a href="carrito.html">Carrito</a>
    <a href="contacto.html">Contacto</a>
</nav>

<main>
    <section>
        <h2>Listado de productos</h2>
        <p>A continuación se muestra una tabla con algunos productos disponibles en la tienda.</p>

        <table>
            <tr>
                <th>Producto</th>
                <th>Precio</th>
                <th>Imagen</th>
                <th>Cantidad</th>
                <th>Añadir</th>
            </tr>

            <tr>
                <td>Portátil</td>
                <td>500 €</td>
                <td>
                    <img src="https://static8.depositphotos.com/1338574/829/i/450/depositphotos_8299228-stock-photo-laptop-with-blue-graphics.jpg" alt="Portátil" width="300" height="300">
                </td>
                <td>
                    <input type="number" id="cantidad-portatil" min="1" value="1">
                </td>
                <td>
                    <button onclick="anadirProducto(1, 500, 'cantidad-portatil')">Añadir al carrito</button>
                </td>
            </tr>

            <tr>
                <td>Ordenador</td>
                <td>600 €</td>
                <td>
                    <img src="https://www.silicon.es/wp-content/uploads/2022/09/14_Thinkcentre_M60q_CR_Hero_Front_TIO_Flex.png" alt="Ordenador" width="300" height="300">
                </td>
                <td>
                    <input type="number" id="cantidad-ordenador" min="1" value="1">
                </td>
                <td>
                    <button onclick="anadirProducto(2, 600, 'cantidad-ordenador')">Añadir al carrito</button>
                </td>
            </tr>

            <tr>
                <td>Ratón</td>
                <td>15 €</td>
                <td>
                    <img src="https://tse3.mm.bing.net/th/id/OIP.vNnTxCeS4QCUlqeHvxPIDwHaEj?rs=1&pid=ImgDetMain&o=7&rm=3" alt="Ratón" width="300" height="300">
                </td>
                <td>
                    <input type="number" id="cantidad-raton" min="1" value="1">
                </td>
                <td>
                    <button onclick="anadirProducto(3, 15, 'cantidad-raton')">Añadir al carrito</button>
                </td>
            </tr>

            <tr>
                <td>Teclado</td>
                <td>25 €</td>
                <td>
                    <img src="https://pngimg.com/uploads/keyboard/keyboard_PNG101847.png" alt="Teclado" width="300" height="300">
                </td>
                <td>
                    <input type="number" id="cantidad-teclado" min="1" value="1">
                </td>
                <td>
                    <button onclick="anadirProducto(4, 25, 'cantidad-teclado')">Añadir al carrito</button>
                </td>
            </tr>

            <tr>
                <td>Auriculares</td>
                <td>30 €</td>
                <td>
                    <img src="https://m.media-amazon.com/images/I/71F2ccIPPLL._AC_SL1500_.jpg" alt="Auriculares" width="200" height="100">
                </td>
                <td>
                    <input type="number" id="cantidad-auriculares" min="1" value="1">
                </td>
                <td>
                    <button onclick="anadirProducto(5, 30, 'cantidad-auriculares')">Añadir al carrito</button>
                </td>
            </tr>
        </table>

        <br>

        <a href="carrito.html">
            <button>Ir al carrito</button>
        </a>
    </section>
</main>

<script src="productos.js"></script>
</body>
</html>
